# Каталог действий Control Plane для policy-service (TAI-ADR-0025, дизайн v0 §8).
# Регистрируется deploy/bootstrap.py; проверяется в CI. Имена действий 1:1 с
# enum Permission (domain/enums.py), кроме admin (→ роль tenant-admin),
# delegations.manage (→ admin API policy-service) и observations.write
# (→ каталог memory-service).
service: control-plane
version: 1

resource_types:
  project_profile:
    scope: workspace
    relations: [owner]
  task:
    scope: workspace
    # type_role — contextual tuple, который Control Plane вычисляет из
    # principal_roles на момент check (роль типа задачи, ADR-0015).
    relations: [owner, requested_by, assignee, type_role]
  run:
    parent: task
    relations: [holder]
  approval:
    scope: workspace
    relations: [requested_by]
  artifact:
    parent: task

actions:
  # --- задачи ---
  tasks.read:
    resource: task
    derived: "owner or requested_by or assignee or tasks.read@scope"
  tasks.write:
    resource: task
    derived: "owner or tasks.write@scope"
  # Запуск прогона (claim, start run, запуск дочернего run) проверяется
  # через tasks.claim; отдельного действия запуска в Permission нет.
  tasks.claim:
    resource: task
    derived: "tasks.claim@scope"
  # Управление прогоном (control messages) проверяется через tasks.write,
  # force-cancel — через claims.manage, подтверждение держателем — через
  # tasks.claim; отдельного действия управления в Permission нет.
  claims.manage:
    resource: task
  # --- approvals ---
  approvals.read:
    resource: approval
    derived: "requested_by or approvals.read@scope"
  approvals.manage:
    resource: approval
  approvals.decide:
    resource: approval
    derived: "approvals.decide@scope but not requested_by"
  # --- артефакты: через задачу; артефакт без задачи — на своём воркспейсе,
  # без обоих — на tenant (CP-ADR-0072 §5) ---
  artifacts.read:
    resources:
      workspace: null
      task: "tasks.read"
      artifact: "artifacts.read@task"
  artifacts.write:
    resources:
      workspace: null
      task: "tasks.write"
      artifact: "artifacts.write@task"
  # --- цели (CP-ADR-0062): решаются на воркспейсе цели (цель уровня
  # tenant — на tenant); отношения owner у цели в модели PDP нет ---
  goals.read:
    resource: workspace
  goals.write:
    resource: workspace
  # --- правила вывода работы (CP-ADR-0063): как цели — на воркспейсе
  # правила (правило уровня tenant — на tenant) ---
  rules.read:
    resource: workspace
  rules.write:
    resource: workspace
  # --- воркспейсы и проекты ---
  workspaces.read:
    resource: workspace
  workspaces.manage:
    resource: workspace
  events.read:
    resource: workspace
  # выгрузка журнала за период (CP-ADR-0068, амендмент В): GET /events:export
  events.export:
    resource: workspace
  projects.read:
    resource: project_profile
    derived: "owner or projects.read@scope"
  projects.manage:
    resource: project_profile
    derived: "owner or projects.manage@scope"
  # --- уровень tenant ---
  org.read:
    resource: tenant
  org.manage:
    resource: tenant
  task_types.read:
    resource: tenant
  task_types.manage:
    resource: tenant
  # --- реестр типов артефактов (CP-ADR-0072 §6) ---
  artifact_types.read:
    resource: tenant
  artifact_types.manage:
    resource: tenant
  # --- реестр агентов (CP-ADR-0073 §5) ---
  agents.read:
    resource: tenant
  agents.manage:
    resource: tenant
  agents.status.write:
    resource: tenant
  # --- процессы (CP-ADR-0074 §11): определения и экземпляры — на воркспейсе
  # процесса (процесс уровня tenant — на tenant), как правила; пакеты и
  # календари — уровень tenant ---
  processes.read:
    resource: workspace
  processes.write:
    resource: workspace
  processes.operate:
    resource: workspace
  packages.test:
    resource: tenant
  packages.plan:
    resource: tenant
  # --- настройки пакетов (CP-ADR-0081 §5): чтение и смена значений —
  # отдельно от packages.plan ---
  packages.settings.read:
    resource: tenant
  packages.settings.manage:
    resource: tenant
  calendars.write:
    resource: tenant
  # --- база знаний (CP-ADR-0060, амендмент 2026-09-28): регистрация пакета
  # онтологии арендатора (scope: tenant); общие пакеты — только
  # администраторы платформы, это право их не касается ---
  knowledge.packs.manage:
    resource: tenant
  # --- подключения (CP-ADR-0079 §12): учёт и типы подключений — уровень
  # tenant ---
  connections.read:
    resource: tenant
  connections.manage:
    resource: tenant
  # отчёт коннектора о статусе подключения; connections.manage его не включает
  connections.status.write:
    resource: tenant
  # секреты агентов по имени (п.11): PUT и DELETE /agents/{key}/secrets/{name}
  agents.secrets.manage:
    resource: tenant
  project_templates.read:
    resource: tenant
  project_templates.manage:
    resource: tenant
  sessions.open:
    resource: tenant
  sessions.manage:
    resource: tenant
  operations.read:
    resource: tenant
  operations.manage:
    resource: tenant
  principals.read:
    resource: tenant
  principals.write:
    resource: tenant
  # --- Skill runtime (ADR-0056): вызов и исполнение — разные права ---
  skills.invoke:
    resource: tenant
  skills.execute:
    resource: tenant
