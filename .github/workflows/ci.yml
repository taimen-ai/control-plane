name: CI

# Private repository on the free plan: every push to main runs only the fast
# checks (ruff, mypy, oss-check). The full suite with PostgreSQL and the image
# build run on demand (workflow_dispatch) and on release tags; reviews run the
# full suite locally before a merge.
on:
  push:
    branches: [main]
    tags: ["v*", "platform/v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/control-plane
    steps:
      - uses: actions/checkout@v4
        with:
          path: services/control-plane
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.PLATFORM_AUTH_SDK_REPO || 'taimen-ai/platform-auth-sdk' }}
          ssh-key: ${{ secrets.PLATFORM_AUTH_SDK_DEPLOY_KEY }}
          path: sdk/platform-auth-sdk
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: services/control-plane/uv.lock
      # The same make targets the runner daemon calls (.agents/runner.yaml).
      - run: make install
      - name: ruff
        run: make lint
      - name: mypy
        run: make typecheck

  checks:
    if: github.event_name == 'workflow_dispatch' || github.ref_type == 'tag'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: control_plane
          POSTGRES_PASSWORD: control_plane
          POSTGRES_DB: control_plane_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U control_plane"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 15
    defaults:
      run:
        working-directory: services/control-plane
    steps:
      # platform-auth-sdk is a path dependency (../../sdk/platform-auth-sdk): the
      # checkouts repeat the umbrella layout (TAI-ADR-0064).
      - uses: actions/checkout@v4
        with:
          path: services/control-plane
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.PLATFORM_AUTH_SDK_REPO || 'taimen-ai/platform-auth-sdk' }}
          ssh-key: ${{ secrets.PLATFORM_AUTH_SDK_DEPLOY_KEY }}
          path: sdk/platform-auth-sdk
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: services/control-plane/uv.lock
      - name: Install dependencies
        run: make install
      - name: Lint
        run: make lint
      - name: Type check
        run: make typecheck
      # S3-compatible store for the ContentStore contract test (CP-ADR-0072).
      # A step, not a service: the MinIO image needs a command line.
      # The upstream Docker Hub image is gone; the Chainguard image is pinned by digest
      # (MinIO RELEASE.2026-09-22T19-25-18Z). Its entrypoint is /usr/bin/minio, so the
      # command starts with "server"; /data in the image is writable by its non-root user.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            cgr.dev/chainguard/minio:latest@sha256:4692462f35d97d7e82c30371d82f057703c5d9489bcae726010594c812f2d285 \
            server /data
          for i in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/live && exit 0
            sleep 1
          done
          docker logs minio
          exit 1
      - name: Tests
        env:
          CP_TEST_DATABASE_URL: postgresql+psycopg://control_plane:control_plane@localhost:5434/control_plane_test
          CP_TEST_S3_ENDPOINT_URL: http://localhost:9000
          CP_TEST_S3_ACCESS_KEY_ID: minioadmin
          CP_TEST_S3_SECRET_ACCESS_KEY: minioadmin
        run: make test PYTEST_ARGS=-q

  docker:
    if: github.event_name == 'workflow_dispatch' || github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      # The build context is the root of the umbrella layout (TAI-ADR-0064):
      # platform-auth-sdk is a path dependency at sdk/platform-auth-sdk.
      - uses: actions/checkout@v4
        with:
          path: services/control-plane
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.PLATFORM_AUTH_SDK_REPO || 'taimen-ai/platform-auth-sdk' }}
          ssh-key: ${{ secrets.PLATFORM_AUTH_SDK_DEPLOY_KEY }}
          path: sdk/platform-auth-sdk
      - name: Build image
        run: docker build -f services/control-plane/Dockerfile -t control-plane:ci .

  # TAI-ADR-0043: the trunk must stay publishable. Same tool as the release
  # (tools/oss_check.py in the umbrella); private stop-list patterns come from a
  # secret and are never committed.
  oss-check:
    # Off unless the repository variable OSS_CHECK_ENABLED is true: the open
    # delivery is checked by the oss.check skill of the platform before anything
    # is published (TAI-ADR-0043), and public repositories hold no stop-list secret.
    if: ${{ vars.OSS_CHECK_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch oss-check from the umbrella
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.OSS_CHECK_REPO || 'taimen-ai/taimen' }}
          # Read-only deploy key of the umbrella while it is private; empty after
          # the public release, then the default token is enough.
          ssh-key: ${{ secrets.TAIMEN_UMBRELLA_DEPLOY_KEY }}
          path: .oss-check
          sparse-checkout: tools/oss_check.py
          sparse-checkout-cone-mode: false
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
      - name: oss-check
        env:
          OSS_CHECK_STOPLIST: ${{ secrets.OSS_CHECK_STOPLIST }}
        run: python3 .oss-check/tools/oss_check.py . --ref HEAD
